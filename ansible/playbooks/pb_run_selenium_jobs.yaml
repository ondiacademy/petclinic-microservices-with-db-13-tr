- hosts: all
  tasks:  
    - name: run all selenium jobs
      ansible.builtin.shell: "docker run --rm  --env MASTER_PUBLIC_IP={{ master_public_ip }} -v {{ workspace }}:{{ workspace }} -w {{ workspace }} clarusway/selenium-py-chrome:latest python {{ item }}"
      with_fileglob: "{{ workspace }}/selenium-jobs/test*.py"
      register: output
    
    - name: print result
      ansible.builtin.debug:
        msg: "{{ item.stdout }}" 
      with_items: "{{ output.results }}"