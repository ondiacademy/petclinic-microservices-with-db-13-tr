services:

  config-server:
    image: petclinic-config-server:dev
    deploy:
      resources: 
        limits: 
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8888"]
      start_period: 30s
      timeout: 5s
      interval: 5s
      retries: 10
    ports:
      - 8888:8888
  
  discovery-server:
    image: petclinic-discovery-server:dev
    deploy:
      resources: 
        limits: 
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8761"]
      start_period: 30s
      timeout: 5s
      interval: 5s
      retries: 10
    ports:
      - 8761:8761
    depends_on:
      config-server:
        condition: service_healthy

  customers-service:
    image: petclinic-customers-service:dev
    restart: on-failure:3
    deploy:
      resources: 
        limits: 
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8081"]
      start_period: 30s
      timeout: 5s
      interval: 5s
      retries: 10
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - 8081:8081

  visits-service:
    image: petclinic-visits-service:dev
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
     - 8082:8082

  vets-service:
    image: petclinic-vets-service:dev
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
     - 8083:8083

  api-gateway:
    image: petclinic-api-gateway:dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
     - 8080:8080

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 9411:9411

  admin-server:
    image: petclinic-admin-server:dev
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
     - 9090:9090

  ## Grafana / Prometheus

  grafana-server:
    image: petclinic-grafana-server:dev
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 3000:3000

  prometheus-server:
    image: petclinic-prometheus-server:dev
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 9091:9090
  
  mysql-server:
    image: mysql:5.7.44
    environment:
      MYSQL_ROOT_PASSWORD: petclinic
      MYSQL_DATABASE: petclinic
    deploy:
      resources:
        limits:
          memory: 256M
    ports: 
      - 3306:3306

