apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f compose.yml -o petclinic_chart/templates/
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: tracing-server
  name: tracing-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tracing-server
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f compose.yml -o petclinic_chart/templates/
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: tracing-server
    spec:
      containers:
        - image: openzipkin/zipkin
          name: tracing-server
          ports:
            - containerPort: 9411
              protocol: TCP
      restartPolicy: Always
